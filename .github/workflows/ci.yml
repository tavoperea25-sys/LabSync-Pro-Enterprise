name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: labsync
          POSTGRES_PASSWORD: labsync
          POSTGRES_DB: labsync_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U labsync"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Type-check (mypy)
        run: mypy app
      - name: Levantar MinIO real para tests de almacenamiento
        # No se usa `services:` porque la imagen de MinIO no arranca el
        # servidor sin un comando explícito (`server /data`), y `services:`
        # de GitHub Actions no admite fijar un `command:` — solo `image`,
        # `env`, `ports`, `volumes` y `options`. Puerto 9000 (no uno
        # arbitrario) a propósito: `conftest.py` solo sobreescribe
        # MINIO_ENDPOINT_INTERNO a "localhost:9000"; MINIO_ENDPOINT_PUBLICO
        # se queda en su default de app/core/config.py, que también es
        # "localhost:9000" — con cualquier otro puerto ambos clientes
        # (interno/público) dejarían de coincidir y las operaciones
        # server-to-server (p. ej. copiar documento) fallarían con
        # NoSuchKey, aunque la subida haya funcionado.
        #
        # `bitnamilegacy/minio` en vez de `minio/minio:latest`
        # (2026-11-06): Docker Hub eliminó el repositorio oficial
        # `minio/minio` (y `minio/mc`) — confirmado, afecta a cualquier CI
        # que no tenga ya la imagen en caché local, rompiendo este paso con
        # "pull access denied: repository does not exist". El mirror de
        # MinIO en quay.io (sugerido como alternativa en varios reportes)
        # también devuelve 401 para pulls anónimos, tanto en `:latest` como
        # en tags de versión fijos — se probó ambos antes de este cambio.
        # `bitnamilegacy/minio` sí se puede bajar sin login.
        #
        # IMPORTANTE — esto es un puente temporal, no una solución
        # definitiva: `bitnamilegacy` es el archivo congelado al que
        # Bitnami/Broadcom movió sus imágenes gratuitas (~agosto 2025) —
        # Docker Hub ya advierte que "no se actualiza más" y que el espacio
        # de nombres completo "puede eliminarse en el futuro", sin ningún
        # parche de seguridad mientras tanto. El mismo destino que tuvo
        # `minio/minio` podría repetirse acá. Ver issue de deuda técnica
        # "Definir almacenamiento de objetos mantenido antes de
        # producción" (mismo comentario y decisión en docker-compose.yml).
        #
        # Fijado por digest (no por `:latest`) por reproducibilidad — no
        # protege contra que Docker Hub borre el repositorio entero, igual
        # que con `minio/minio`. Verificado que acepta el mismo comando
        # (`server /data`) y las mismas variables de entorno
        # (`MINIO_ROOT_USER`/`MINIO_ROOT_PASSWORD`/`MINIO_KMS_SECRET_KEY`),
        # y que `bucket_exists`/`make_bucket`/`set_bucket_encryption`
        # (SSE-S3) funcionan igual.
        #
        # `--user root`: EXCEPCIÓN deliberada solo para este job de CI —
        # a diferencia del `docker-compose.yml` local (que ya NO corre como
        # root; corrige en su lugar el dueño del volumen persistente), este
        # contenedor es efímero, sin volumen montado y se descarta al
        # terminar el job, así que no hay nada que proteger corriendo como
        # root acá. Esta imagen de Bitnami corre como UID 1001 por
        # defecto (no root, a diferencia de la oficial) — en el runner de
        # GitHub eso dio "FATAL Unable to initialize backend: file access
        # denied" al escribir /data (un filesystem nuevo, sin volumen).
        # Correrlo como root evita esa clase de problema de permisos.
        run: |
          docker run -d --name minio-ci -p 9000:9000 --user root \
            -e MINIO_ROOT_USER=labsync -e MINIO_ROOT_PASSWORD=labsync123 \
            -e MINIO_KMS_SECRET_KEY="labsync-master-key:w09R7021SABtUCVnFUVbShEhWfn2ONiWmFbD0ruskaw=" \
            bitnamilegacy/minio@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c server /data
          # 60 intentos (antes 30) — bitnamilegacy/minio arranca con un
          # entrypoint bash más pesado que el binario oficial (branding,
          # chequeos adicionales) y tardó más de 30s en quedar listo en el
          # runner de GitHub (que además es más lento que una máquina de
          # desarrollo) la primera vez que se probó este cambio, aunque
          # localmente respondía en 1-2s.
          for i in $(seq 1 60); do
            if curl -sf http://localhost:9000/minio/health/live >/dev/null; then
              echo "MinIO listo tras ${i} intento(s)"
              exit 0
            fi
            sleep 1
          done
          echo "MinIO no respondió a tiempo — logs del contenedor:" >&2
          docker logs minio-ci >&2
          exit 1
      - name: Tests (incluye gate de aislamiento multi-tenant)
        env:
          # OJO: debe ser `labsync_app` (rol restringido de runtime), NO
          # `labsync` (rol de migraciones, dueño de las tablas). Postgres
          # bypassa RLS —incluso con FORCE ROW LEVEL SECURITY— para el
          # dueño de la tabla (ver alembic/versions/0001_esquema_inicial_auth.py).
          # Conectar como `labsync` aquí deshabilita silenciosamente el gate
          # de aislamiento multi-tenant para toda la suite: las políticas
          # RLS dejan de filtrar, así que un tenant ve/escribe filas de
          # otro, y eso además contamina el resto de tests con datos
          # cruzados. TEST_DATABASE_URL_MIGRACIONES sí debe seguir usando
          # `labsync` (no se define aquí — cae al default de conftest.py).
          TEST_DATABASE_URL: postgresql+psycopg2://labsync_app:labsync_app@localhost:5432/labsync_test
        run: pytest --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package.json
      - run: npm install
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
